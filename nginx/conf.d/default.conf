server {
    listen 80;
    server_name site1.local;

    location / {
        root /usr/share/nginx/html/site1;
        index index.html;
    }

    # Chuyển tiếp request API sang Node-RED
    location /api/ {
        proxy_pass http://nodered:1880/api/;
    }
}

server {
    listen 80;
    server_name site2.local;

    location / {
        root /usr/share/nginx/html/site2;
        index index.html;
    }
}
